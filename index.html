<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List App</title>
    <link rel="stylesheet" href="toDo.css" />
    <link rel="icon" href="assets/browser-icon.png" />
    <script src="https://kit.fontawesome.com/8e0278b98b.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200..700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
    <body class="flex flex-col min-h-[100vh] m-0 text-[#EA00D9] bg-gradient-to-br from-[#0B0A4E] via-[#1a0a3a] to-[#0B0A4E]">
    <div class="flex flex-col items-center justify-center flex-grow px-3 py-6 sm:px-6 sm:py-10">
        <div class="grid place-items-center mb-5">
            <h1 class="text-3xl sm:text-4xl text-[#EA00D9] tracking-[2px] [text-shadow:0_0_5px_#EA00D9,_0_0_10px_#EA00D9,_0_0_30px_#7C13A4] text-center">
              TaskForge
            </h1>
        </div>

        <div class="grid justify-center border-2 border-[#2AAEB6] rounded-[10px] w-[94%] sm:w-fit min-w-[280px] sm:min-w-[320px] max-w-[94vw] sm:max-w-[600px] md:max-w-[650px] transition-all duration-300 h-auto bg-[rgba(11, 10, 78, 0.6)] shadow-[0_0_20px_rgba(42, 174, 182, 0.3),_inset_0_0_20px_rgba(42, 174, 182, 0.1)] p-3 sm:p-[1rem]">
            <ul id="taskList" class="pl-0 max-h-[200px] overflow-auto"></ul>
            <p id="emptyState" class="hidden text-[#2AAEB6] text-center py-[10px] text-sm tracking-wide">
                <i class="fa-solid fa-check text-[#2AAEB6]/20" style="animation: pulse 2s ease-in-out infinite"></i> No tasks added yet.
            </p>
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5 p-2 sm:p-4">
                <input type="text" id="taskInput" class="task-input flex-1 min-w-0 px-[10px] py-[10px] rounded-[10px] border-2 border-[#2AAEB6] bg-[#080A4E] text-[#2AAEB6] focus:outline-none focus:border-[#EA00D9] focus:ring-2 focus:ring-pink-500/50" placeholder="Enter a new task"/>
                <button id="addTaskButton" class="w-full sm:w-auto px-[20px] py-[10px] rounded-[10px] bg-[#080A4E] text-[#EA00D9] border-[#EA00D9] border-2 shadow-[0_0_10px_rgba(234,_0,_217,_0.4)] transition-all duration-300 hover:bg-[#EA00D9] hover:text-[#0B0A4E] hover:-translate-y-1 hover:shadow-[0_0_20px_rgba(234,_0,_217,_0.8),_0_6px_20px_rgba(234,_0,_217,_0.6)]">
                    Add Task
                </button>
            </div>
            <p id="validationMessage" class="hidden text-red-400 text-sm text-center m-0"></p>
        </div>

        <div class="flex items-center justify-center gap-3 sm:gap-4 mt-4 flex-wrap text-center">
            <p id="taskCounter" class="text-[#2AAEB6] text-xs sm:text-sm">Total: 0</p>
            <p id="completedTasks" class="text-[#2AAEB6] text-xs sm:text-sm">
                Completed: 0
            </p>
            <div class="w-20 sm:w-24 h-2 bg-[#0B0A4E] rounded-full overflow-hidden">
                <div id="progressBar" class="h-full bg-gradient-to-r from-[#2AAEB6] to-[#EA00D9] transition-width" style="width: 0%"></div>
            </div>
        </div>
        <button id="deleteAllButton" class="hidden w-full sm:w-auto px-[20px] py-[10px] text-xs sm:text-[15px] bg-[#0B0A4E] text-[#EA00D9] border-2 border-[#EA00D9] rounded-[10px] mt-3 shadow-[0_0_10px_rgba(234,0,217,0.4)] transition-all duration-300 hover:bg-[#EA00D9] hover:text-[#0B0A4E] hover:-translate-y-1 hover:[text-shadow:0_0_20px_rgba(234,0,217,0.8),_0_6px_20px_rgba(234,0,217,0.6)]">
            Delete All Tasks
        </button>
    </div>

    <footer class="text-[#2AAEB6] py-[15px] sm:py-[20px] border-t-2 border-t-[#2AAEB6] shadow-[0_-5px_15px_rgba(42,174,182,0.2)] bg-[linear-gradient(135deg,#1a0a3a_0%,#0B0A4E_50%,#1a0a3a_100%)]">
      <div class="flex flex-col sm:flex-row items-center justify-between px-4 sm:px-8 gap-3 sm:gap-0">
        <p class="text-[#EA00D9] [text-shadow:_0_0_10px_#EA00D9,_0_0_20px_#EA00D9,_0_0_30px_#7C13A4] m-0 text-sm">
          &copy; <span id="footerYear">2026</span> KT
        </p>
        <div class="flex justify-center items-center gap-[15px] sm:gap-[20px]">
          <a href="https://kt-portfolio-website.vercel.app/" target="_blank" class="text-[#2AAEB6] no-underline text-md transition-all duration-300 hover:text-[#EA00D9] hover:-translate-y-1 hover:[text-shadow:0_0_10px_#EA00D9]"><i class="fa-solid fa-globe fa-1x"></i></a>
          <a href="https://www.linkedin.com/in/kitan-ayoola-1471193a1/" target="_blank" class="text-[#2AAEB6] no-underline text-md transition-all duration-300 hover:text-[#EA00D9] hover:-translate-y-1 hover:[text-shadow:0_0_10px_#EA00D9]"><i class="fa-brands fa-linkedin-in fa-1x"></i></a>
          <a href="https://github.com/B0lt5" target="_blank" class="text-[#2AAEB6] no-underline text-md transition-all duration-300 hover:text-[#EA00D9] hover:-translate-y-1 hover:[text-shadow:0_0_10px_#EA00D9]"><i class="fa-brands fa-github fa-1x"></i></a>
          <a href="https://x.com/oluwakitan17466" target="_blank" class="text-[#2AAEB6] no-underline text-md transition-all duration-300 hover:text-[#EA00D9] hover:-translate-y-1 hover:[text-shadow:0_0_10px_#EA00D9]"><i class="fa-brands fa-x-twitter fa-1x"></i></a>
        </div>
      </div>
    </footer>

    <script src="toDoList.js"></script>
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
